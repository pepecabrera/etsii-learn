# Integración continua: en cada push o pull request se ejecuta el script de
# construcción del proyecto (scripts/build.py), el mismo que se usa en local.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Construir y comprobar
        run: python scripts/build.py
